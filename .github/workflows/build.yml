name: Build and test Imperium
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: imperium-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build mod against pinned RimWorld 1.7 references
        run: dotnet build Source/Imperium.LivingWorlds.csproj --configuration Release
      - name: Test construction approval rules
        run: dotnet run --project Tests/Imperium.Core.Tests/Imperium.Core.Tests.csproj --configuration Release
      - name: Package development mod
        run: python Scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: Imperium-Living-Worlds-dev-${{ github.sha }}
          path: artifacts/Imperium-Living-Worlds-dev.zip
          if-no-files-found: error
          retention-days: 14
